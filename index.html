<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain Lookup — KAVL</title>
<style>
  :root {
    --ink: #1c2321;
    --paper: #f6f4ef;
    --line: #d8d3c6;
    --rain: #2f6690;
    --accent: #b3541e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px 18px 60px;
    max-width: 480px;
    margin-inline: auto;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .sub {
    color: #6b6558;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .quick {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  .quick button {
    flex: 1;
    padding: 12px 8px;
    border: 1px solid var(--line);
    background: white;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--ink);
  }
  .quick button:active {
    background: var(--rain);
    color: white;
  }
  .manual {
    border-top: 1px solid var(--line);
    padding-top: 16px;
    margin-top: 4px;
  }
  .manual label {
    display: block;
    font-size: 0.8rem;
    color: #6b6558;
    margin-bottom: 4px;
  }
  .manual .row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .manual input[type=date] {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 0.95rem;
    background: white;
  }
  .manual button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--ink);
    color: white;
    font-size: 0.95rem;
    font-weight: 500;
  }
  #status {
    margin-top: 20px;
    font-size: 0.85rem;
    color: #6b6558;
    min-height: 1.2em;
  }
  #result {
    margin-top: 12px;
  }
  .total {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .total .amt {
    font-size: 2rem;
    font-weight: 700;
    color: var(--rain);
  }
  .total .label {
    font-size: 0.85rem;
    color: #6b6558;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  th, td {
    text-align: left;
    padding: 6px 4px;
    border-bottom: 1px solid var(--line);
  }
  td.amt-cell {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .rained { color: var(--rain); font-weight: 600; }
  .error {
    color: var(--accent);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

  <h1>Rain Lookup</h1>
  <div class="sub">Your location — 28803</div>

  <div class="quick">
    <button onclick="lookupDays(3)">Last 3 days</button>
    <button onclick="lookupDays(7)">Last week</button>
  </div>

  <div class="manual">
    <div class="row">
      <div style="flex:1">
        <label for="start">Start date</label>
        <input type="date" id="start">
      </div>
      <div style="flex:1">
        <label for="end">End date</label>
        <input type="date" id="end">
      </div>
    </div>
    <button onclick="lookupRange()">Check this range</button>
  </div>

  <div id="status"></div>
  <div id="result"></div>

<script>
  function fmtDate(d) {
    return d.toISOString().slice(0, 10);
  }

  function lookupDays(n) {
    const end = new Date();
    const start = new Date();
    start.setDate(end.getDate() - (n - 1));
    runLookup(fmtDate(start), fmtDate(end));
  }

  function lookupRange() {
    const start = document.getElementById('start').value;
    const end = document.getElementById('end').value;
    if (!start || !end) {
      document.getElementById('status').textContent = 'Pick both a start and end date.';
      return;
    }
    runLookup(start, end);
  }

  // Your approximate coordinates (28803, Biltmore Forest / Asheville, NC)
  const LAT = 35.5402;
  const LON = -82.5286;

  async function runLookup(sdate, edate) {
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    resultEl.innerHTML = '';
    statusEl.textContent = 'Checking ' + sdate + ' to ' + edate + '...';

    const url = 'https://archive-api.open-meteo.com/v1/archive' +
                '?latitude=' + LAT + '&longitude=' + LON +
                '&start_date=' + sdate + '&end_date=' + edate +
                '&daily=precipitation_sum' +
                '&precipitation_unit=inch' +
                '&timezone=America%2FNew_York';

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Server returned ' + res.status);
      const data = await res.json();

      if (!data.daily || !data.daily.time || data.daily.time.length === 0) {
        statusEl.textContent = '';
        resultEl.innerHTML = '<div class="error">No data returned for that range.</div>';
        return;
      }

      const dates = data.daily.time;
      const amounts = data.daily.precipitation_sum;

      let total = 0;
      let rows = '';
      dates.forEach((date, i) => {
        const num = amounts[i];
        const isNum = typeof num === 'number' && !isNaN(num);
        if (isNum) total += num;
        rows += '<tr><td>' + date + '</td><td class="amt-cell' +
                (isNum && num > 0 ? ' rained' : '') + '">' +
                (isNum ? num.toFixed(2) + '"' : '—') + '</td></tr>';
      });

      statusEl.textContent = '';
      resultEl.innerHTML =
        '<div class="total">' +
          '<div class="amt">' + total.toFixed(2) + '"</div>' +
          '<div class="label">total, ' + sdate + ' to ' + edate + '</div>' +
        '</div>' +
        '<table><tr><th>Date</th><th style="text-align:right">Precip</th></tr>' +
        rows + '</table>';

    } catch (err) {
      statusEl.textContent = '';
      resultEl.innerHTML = '<div class="error">Could not reach the weather service. ' +
        'Check your connection and try again.</div>';
    }
  }
</script>

</body>
</html>
